name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tests unitaires et compilation de l'APK
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Publier l'APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Publier le journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      # En cas d'échec, le journal est déposé dans une issue afin qu'il soit
      # lisible depuis un téléphone (et par l'assistant) sans ouvrir les logs Actions.
      - name: Ouvrir une issue en cas d'échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('build.log', 'utf8');
            } catch (error) {
              log = 'Journal indisponible : la compilation a échoué avant sa création.';
            }
            const lines = log.split('\n');
            let tail = lines.slice(-300).join('\n');
            if (tail.length > 55000) {
              tail = tail.slice(tail.length - 55000);
            }
            const shortSha = context.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Compilation en échec — ${shortSha}`,
              body: [
                `Commit : \`${context.sha}\``,
                `Exécution : ${runUrl}`,
                '',
                'Fin du journal de compilation :',
                '',
                '```',
                tail,
                '```'
              ].join('\n')
            });
